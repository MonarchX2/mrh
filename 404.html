<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020b1a" />
    <title>Loading Maritime Review Hub</title>
    <script>
      (function () {
        let themeValue = "";
        try {
          const match = document.cookie.match(/(?:^|;\s*)mrh_theme=([^;]+)/);
          themeValue = match ? decodeURIComponent(match[1]) : "";
        } catch (error) {}

        const darkMode = themeValue !== "light";
        const root = document.documentElement;
        root.classList.toggle("dark", darkMode);
        root.style.colorScheme = darkMode ? "dark" : "light";
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) {
          themeColor.content = darkMode ? "#020b1a" : "#f8fafc";
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #020b1a;
        color: #e5e7eb;
      }
      html:not(.dark) {
        color-scheme: light;
        background: #f8fafc;
        color: #1f2937;
      }
      body {
        display: grid;
        box-sizing: border-box;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
        place-items: center;
      }
      p {
        max-width: 34rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <p>Loading Maritime Review Hub...</p>
    <script>
      (async function () {
        "use strict";

        const pathSegments = window.location.pathname
          .split("/")
          .filter(Boolean);
        const baseLengths = [];

        // GitHub Pages project sites use the first path segment as their app base.
        if (
          window.location.hostname.endsWith(".github.io") &&
          pathSegments.length > 1
        ) {
          baseLengths.push(1);
        }
        for (
          let baseLength = pathSegments.length;
          baseLength >= 0;
          baseLength--
        ) {
          if (baseLengths.includes(baseLength)) continue;
          baseLengths.push(baseLength);
        }

        const candidates = baseLengths.map((baseLength) => {
          const baseSegments = pathSegments.slice(0, baseLength);
          const basePath = `/${baseSegments.join("/")}${baseSegments.length ? "/" : ""}`;
          return { baseLength, basePath };
        });

        for (const candidate of candidates) {
          try {
            const candidateUrl = new URL(
              `${candidate.basePath}index.html`,
              window.location.origin,
            );
            candidateUrl.search = window.location.search;
            const response = await fetch(candidateUrl.href, {
              cache: "no-store",
            });
            if (!response.ok) continue;

            const appHtml = await response.text();
            const routeSegments = pathSegments
              .slice(candidate.baseLength)
              .map((segment) =>
                decodeURIComponent(segment.replace(/\+/g, " ")),
              );
            const legacyHashRoute = window.location.hash.startsWith("#/")
              ? window.location.hash
                  .slice(2)
                  .split("/")
                  .filter(Boolean)
                  .map((segment) =>
                    decodeURIComponent(segment.replace(/\+/g, " ")),
                  )
              : [];
            const navigationSegments = routeSegments.length
              ? routeSegments
              : legacyHashRoute;
            const searchParams = new URLSearchParams(
              window.location.search,
            );
            const legacyQueryRoute = searchParams.get("mrhRoute");
            const rawQueryRoute = window.location.search
              .replace(/^\?/, "")
              .split("&", 1)[0];
            const queryRoute =
              legacyQueryRoute !== null
                ? legacyQueryRoute
                : rawQueryRoute && !rawQueryRoute.includes("=")
                  ? rawQueryRoute
                  : null;
            const querySegments = queryRoute
              ? queryRoute
                  .split("/")
                  .filter(Boolean)
                  .map((segment) =>
                    decodeURIComponent(segment.replace(/\+/g, " ")),
                  )
              : [];
            const restoredSegments = navigationSegments.length
              ? navigationSegments
              : querySegments;
            if (legacyQueryRoute !== null) {
              searchParams.delete("mrhRoute");
            } else if (rawQueryRoute && !rawQueryRoute.includes("=")) {
              const bareRouteKey = new URLSearchParams(rawQueryRoute)
                .keys()
                .next().value;
              if (bareRouteKey) searchParams.delete(bareRouteKey);
            }
            const remainingSearch = searchParams.toString();
            const migratedQuery =
              legacyQueryRoute !== null && !routeSegments.length
                ? querySegments
                    .map((segment) =>
                      encodeURIComponent(segment).replace(/%20/g, "+"),
                    )
                    .join("/")
                : "";
            const queryParts = [
              migratedQuery,
              ...remainingSearch.split("&").filter(Boolean),
            ].filter(Boolean);
            if (navigationSegments.length) {
              window.history.replaceState(
                {
                  ...(window.history.state &&
                  typeof window.history.state === "object"
                    ? window.history.state
                    : {}),
                  mrhPath: restoredSegments,
                },
                "",
                `${window.location.pathname}${queryParts.length ? `?${queryParts.join("&")}` : ""}`,
              );
            } else if (queryRoute !== null) {
              window.history.replaceState(
                {
                  ...(window.history.state &&
                  typeof window.history.state === "object"
                    ? window.history.state
                    : {}),
                  mrhPath: restoredSegments,
                },
                "",
                `${window.location.pathname}${queryParts.length ? `?${queryParts.join("&")}` : ""}`,
              );
            }
            const baseElement = `<base href="${candidate.basePath}">`;
            const appHtmlWithBase = appHtml.replace(
              /<head(?:\s[^>]*)?>/i,
              (head) => `${head}${baseElement}`,
            );
            const appHtmlWithFallbackBase =
              appHtmlWithBase === appHtml
                ? appHtml.replace(
                    /<html(?:\s[^>]*)?>/i,
                    (html) => `${html}<head>${baseElement}`,
                  )
                : appHtmlWithBase;
            if (appHtmlWithFallbackBase === appHtml) {
              throw new Error(
                  "Application entry point has no HTML root element.",
              );
            }

            document.open();
            document.write(appHtmlWithFallbackBase);
            document.close();
            return;
          } catch (error) {
            console.warn("Unable to load application entry point.", error);
          }
        }

        document.body.innerHTML =
          "<p>Unable to load Maritime Review Hub. Please check your connection and try again.</p>";
      })();
    </script>
  </body>
</html>
